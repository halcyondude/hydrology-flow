name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Format check (ruff)
        run: uv run ruff format --check src tests

      - name: Type check (mypy --strict)
        run: uv run mypy --strict src tests

      - name: No hard-coded geography in src/
        run: scripts/check_no_geography.sh src

      - name: Tests (network tests skipped)
        run: uv run pytest -m "not network"

      - name: CLI smoke test
        run: uv run hflow --help
